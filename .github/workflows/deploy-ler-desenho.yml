name: Publicar leitura de foto e sincronização (Supabase)

# Publica a função ler-desenho no Supabase e grava o endereço dela em config.js.
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — token pessoal do Supabase (Account → Access Tokens)
#   (o id do projeto traco, frcvjcrxcflsyzmdalom, já está fixo abaixo)
#   ANTHROPIC_API_KEY      — chave da API Claude (fica como segredo da função)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/ler-desenho/**', 'supabase/sync.sql', '.github/workflows/deploy-ler-desenho.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || 'frcvjcrxcflsyzmdalom' }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        run: |
          faltam=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && faltam="$faltam SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ] && faltam="$faltam SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && faltam="$faltam ANTHROPIC_API_KEY"
          if [ -n "$faltam" ]; then echo "::error::Faltam segredos:$faltam"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Guardar a chave da IA na função
        run: supabase secrets set --yes --project-ref "$REF" ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
      - name: Publicar ler-desenho
        run: supabase functions deploy ler-desenho --yes --project-ref "$REF" --no-verify-jwt --use-api
      - name: Banco da sincronização (tabela + regras de acesso)
        run: |
          jq -Rs '{query: .}' supabase/sync.sql > /tmp/q.json
          curl -sS -f -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/q.json
      - name: Login por código no e-mail
        run: |
          MODELO='<h2>Traço</h2><p>Seu código para entrar:</p><p style="font-size:30px;font-weight:bold;letter-spacing:6px">{{ .Token }}</p><p>Digite esse código no app. Se não foi você, ignore este e-mail.</p>'
          jq -n --arg m "$MODELO" '{site_url:"https://traco-estudio.vercel.app", uri_allow_list:"https://traco-estudio.vercel.app/**,https://gestorsolucoesapp-sketch.github.io/traco-3d/**", mailer_subjects_magic_link:"Seu código do Traço", mailer_templates_magic_link_content:$m, mailer_subjects_confirmation:"Seu código do Traço", mailer_templates_confirmation_content:$m}' > /tmp/a.json
          COD=$(curl -sS -o /tmp/r.txt -w '%{http_code}' -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @/tmp/a.json)
          echo "auth config: $COD"; [ "$COD" -lt 300 ] || { head -c 800 /tmp/r.txt; exit 1; }
      - name: Gravar endereço no app (config.js)
        run: |
          ANON=$(curl -sS -f "https://api.supabase.com/v1/projects/$REF/api-keys?reveal=true" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" | jq -r '([.[] | select(.name=="anon")][0].api_key) // ([.[] | select(.type=="publishable")][0].api_key) // empty')
          echo "window.TRACO_LER_URL = 'https://$REF.supabase.co/functions/v1/ler-desenho';" > config.js
          [ -n "$ANON" ] && echo "window.TRACO_SUPA = { url: 'https://$REF.supabase.co', chave: '$ANON' };" >> config.js
          if ! git diff --quiet -- config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config.js && git commit -m "chore: endereço da leitura de foto" && git push
          fi
