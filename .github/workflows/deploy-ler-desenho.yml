name: Publicar leitura de foto (Supabase)

# Publica a função ler-desenho no Supabase e grava o endereço dela em config.js.
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  — token pessoal do Supabase (Account → Access Tokens)
#   (o id do projeto traco, frcvjcrxcflsyzmdalom, já está fixo abaixo)
#   ANTHROPIC_API_KEY      — chave da API Claude (fica como segredo da função)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/ler-desenho/**', '.github/workflows/deploy-ler-desenho.yml']

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      REF: ${{ secrets.SUPABASE_PROJECT_REF || 'frcvjcrxcflsyzmdalom' }}
    steps:
      - uses: actions/checkout@v4
      - name: Conferir segredos
        run: |
          faltam=""
          [ -z "$SUPABASE_ACCESS_TOKEN" ] && faltam="$faltam SUPABASE_ACCESS_TOKEN"
          [ -z "$REF" ] && faltam="$faltam SUPABASE_PROJECT_REF"
          [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ] && faltam="$faltam ANTHROPIC_API_KEY"
          if [ -n "$faltam" ]; then echo "::error::Faltam segredos:$faltam"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Guardar a chave da IA na função
        run: supabase secrets set --project-ref "$REF" ANTHROPIC_API_KEY="${{ secrets.ANTHROPIC_API_KEY }}"
      - name: Publicar ler-desenho
        run: supabase functions deploy ler-desenho --project-ref "$REF" --no-verify-jwt
      - name: Gravar endereço no app (config.js)
        run: |
          echo "window.TRACO_LER_URL = 'https://$REF.supabase.co/functions/v1/ler-desenho';" > config.js
          if ! git diff --quiet -- config.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config.js && git commit -m "chore: endereço da leitura de foto" && git push
          fi
